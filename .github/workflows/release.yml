name: Release

# Publishing to npm is done manually from the CLI (npm publish). This workflow
# only creates a GitHub Release with auto-generated notes when a v* tag is
# pushed — it never publishes, so it can't fail on a duplicate version.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
